[project]
name = "masters-cycling-lab"
version = "0.1.0"
description = "Research RAG workspace for evidence relevant to masters cyclists"
requires-python = ">=3.12,<3.13"
# Direct dependencies are pinned exactly; uv.lock pins everything else.
dependencies = [
    "alembic==1.20.1",
    "fastapi==0.162.5",
    "httpx==0.28.1",
    "pgvector==0.5.1",
    "psycopg[binary]==3.3.9",
    "pydantic==2.14.3",
    "pydantic-settings==2.16.2",
    "pymupdf==1.28.2",
    "python-multipart==0.0.33",
    "sentence-transformers==6.3.0",
    "sqlalchemy==2.1.8",
    "torch==2.15.0",
    "uvicorn==0.54.0",
]

[project.scripts]
mcl = "masters_cycling_lab.cli:main"

[dependency-groups]
dev = [
    "mypy==2.4.1",
    "pytest==9.2.0",
    "ruff==0.17.4",
]

[build-system]
requires = ["uv_build>=0.13,<0.14"]
build-backend = "uv_build"

# Linux wheels from PyPI pull in CUDA. Use the CPU-only build there; macOS wheels are already CPU/MPS.
[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]

[tool.mypy]
strict = true
plugins = ["pydantic.mypy"]
mypy_path = "src"

[[tool.mypy.overrides]]
module = ["pgvector.*", "pymupdf.*", "sentence_transformers.*"]
ignore_missing_imports = true

# PyMuPDF ships only partial type hints.
[[tool.mypy.overrides]]
module = ["masters_cycling_lab.infrastructure.pdf.*", "masters_cycling_lab.smoke", "tests.*"]
disallow_untyped_calls = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
# PyMuPDF's SWIG bindings trigger this on import; it is not ours to fix.
filterwarnings = ["ignore:builtin type .* has no __module__ attribute:DeprecationWarning"]
markers = [
    "integration: needs a running PostgreSQL (make up)",
    "model: loads the real embedding model (make download-model)",
    "live: calls the configured LLM provider; costs money",
]
