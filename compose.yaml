# Local, single-user stack. Published ports are bound to 127.0.0.1 only; the app has no login.
name: masters-cycling-lab

x-backend: &backend
  build:
    context: .
    dockerfile: backend/Dockerfile
  image: masters-cycling-lab-backend
  env_file: .env
  environment:
    # Containers reach the database by service name; .env's DATABASE_URL is for tools on the host.
    DATABASE_URL: postgresql+psycopg://mcl:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@db:5432/mcl
    STORAGE_ROOT: /data/storage
  volumes:
    - storage:/data/storage
  depends_on:
    db:
      condition: service_healthy

services:
  db:
    image: pgvector/pgvector:0.8.7-pg17-trixie
    environment:
      POSTGRES_USER: mcl
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: mcl
    # Published on loopback for integration tests and psql from the host. Remove if you don't need that.
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mcl -d mcl"]
      interval: 5s
      timeout: 3s
      retries: 20

  # Run explicitly with `make migrate`. Nothing else changes the schema.
  migrate:
    <<: *backend
    command: ["alembic", "upgrade", "head"]
    profiles: ["tools"]
    restart: "no"

  api:
    <<: *backend
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health/live', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    image: masters-cycling-lab-frontend
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--spider", "http://127.0.0.1:8080/"]
      interval: 10s
      timeout: 3s
      retries: 6
    depends_on:
      api:
        condition: service_healthy

volumes:
  pgdata:
  storage:
