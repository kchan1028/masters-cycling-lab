name: Code quality

on:
  pull_request:
  # Also run after merges, so a broken main shows up on main and not on the next unrelated PR.
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: code-quality-${{ github.ref }}
  # Cancel superseded PR runs; let every main run finish so each merge has a result.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.7"
          enable-cache: true
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: make bootstrap
      - name: Lint (Ruff, ESLint)
        run: make lint
      - name: Typecheck (mypy, tsc)
        run: make typecheck
      - name: Offline tests (pytest, Vitest)
        run: make test
      - name: OpenAPI file and frontend types are up to date
        run: make check-api-types
      - name: Production frontend build
        run: make build

  # Fails a PR that adds or upgrades a dependency with a known high or critical vulnerability.
  # Reads the PR's lockfile diff through GitHub's dependency graph; needs no secrets.
  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
