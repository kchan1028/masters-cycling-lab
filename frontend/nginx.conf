server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;

    # Look the API up through Docker's DNS instead of once at startup. A recreated API container (after a restore,
    # or `make up` with a changed .env) gets a new address, and a fixed one would leave every request failing with 502.
    resolver 127.0.0.11 valid=10s ipv6=off;

    location /api/ {
        set $api http://api:8000;
        proxy_pass $api;
        # Keep the browser's Host (with port) so the API's host and origin checks see what the browser sent.
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # The API enforces MAX_UPLOAD_BYTES itself; this only stops absurd uploads early.
        client_max_body_size 100m;
        proxy_read_timeout 180s;
    }

    location / {
        try_files $uri /index.html;
    }
}
